# omaslack CI, tuned to spend as few shared-runner minutes as possible:
#
# - One pipeline per change: merge request pipelines, or pushes to main when
#   there is no MR. Never a branch pipeline and an MR pipeline for the same commit.
# - One job does vet + lint + test, on the official Go image; golangci-lint is a
#   prebuilt binary (seconds), not compiled.
# - The job is skipped entirely when no Go or CI file changed (docs and specs
#   never cost a minute).
# - Go module, build and lint caches are keyed on go.mod/go.sum; MRs only pull
#   the cache, main pulls and pushes it.
# - Releases run only on version tags.
# - Checks that need an Omarchy machine (qmllint against the shell, omarchy
#   plugin validate, OpenSpec) run locally with `make local`.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

default:
  interruptible: true
  timeout: 10m

variables:
  GIT_DEPTH: "1"
  GOLANGCI_LINT_VERSION: "2.14.0"
  GOLANGCI_LINT_SHA256: "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab"
  GOPATH: $CI_PROJECT_DIR/.cache/go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.cache/golangci-lint
  CGO_ENABLED: "0"
  GOFLAGS: "-mod=readonly"

stages: [check, release]

.go-changes: &go-changes
  - "**/*.go"
  - go.mod
  - go.sum
  - .golangci.yml
  - .gitlab-ci.yml

check:
  stage: check
  image: golang:1.26-alpine
  cache:
    key:
      files: [go.mod, go.sum]
    paths: [.cache/go/pkg/mod, .cache/go-build, .cache/golangci-lint]
    policy: $CACHE_POLICY
  variables:
    CACHE_POLICY: pull
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *go-changes
        compare_to: refs/heads/main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
      variables:
        CACHE_POLICY: pull-push
  script:
    - wget -qO /tmp/gl.tgz "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
    - echo "${GOLANGCI_LINT_SHA256}  /tmp/gl.tgz" | sha256sum -c -
    - tar -xzf /tmp/gl.tgz -C /tmp && mv "/tmp/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" /usr/local/bin/
    - go vet ./...
    - golangci-lint run ./...
    - go test ./...

# Releases: GitLab release with signed checksums, then the AUR package
# (packaging/release.sh). Only on vX.Y.Z tags. The AUR key (AUR_SSH_KEY, a
# protected and masked variable, base64 on one line) is readable only by
# protected tags, so branch and MR pipelines never see it, and they never
# run this job.
release:
  stage: release
  image:
    name: goreleaser/goreleaser:v2.20.2@sha256:1c96a03548de3545dc7030310ed03ebe22b4f0e80d93974c108de795bd129fa8
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  # A release half done is worse than a slow one.
  interruptible: false
  timeout: 20m
  variables:
    GIT_DEPTH: "0"
    # The image's Go is 1.27; build and test with the Go 1.26 that mise.toml
    # and the check job use (go fetches that toolchain). PNG output, and so
    # the TUI's golden images, differ between the two.
    GOTOOLCHAIN: go1.26.11
    COSIGN_VERSION: "3.1.4"
    COSIGN_SHA256: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
  # OIDC token for cosign keyless signing (cosign reads SIGSTORE_ID_TOKEN).
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - packaging/release.sh
