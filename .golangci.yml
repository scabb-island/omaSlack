version: "2"

run:
  timeout: 3m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # internal packages; doc comments are reviewed by hand
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]
      # Spikes are throwaway experiments run by hand on a dev machine.
      - path: ^spikes/
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
